name: APK derle

on:
  push:
    branches: ['**']
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Debug + Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: JDK 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle önbelleği
        uses: gradle/actions/setup-gradle@v4

      - name: Android SDK hazırla
        uses: android-actions/setup-android@v3
        with:
          # Varsayılan paket listesi artık kaldırılmış olan 'tools' paketini
          # kurmaya çalışıp hata veriyor; runner imajında SDK zaten var, sadece
          # lisansların kabul edilmesi yeterli.
          packages: ''

      - name: SDK lisanslarını kabul et
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Shader'ları derle (GLSL ES 3.00)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y glslang-tools
          python3 android/tools/check_shaders.py

      - name: Birim testleri (oyun simülasyonu)
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Debug APK derle
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Release APK derle
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_FILE: ${{ github.workspace }}/android/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # İmza anahtarı gizli değişken olarak tanımlıysa onu kullan,
          # tanımlı değilse Gradle otomatik olarak debug imzasına düşer.
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_FILE"
          else
            unset KEYSTORE_FILE
          fi
          ./gradlew --no-daemon assembleRelease

      - name: Test raporlarını yükle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-raporu
          path: android/app/build/reports/tests/
          if-no-files-found: ignore

      - name: APK'ları yükle
        uses: actions/upload-artifact@v4
        with:
          name: son-karargah-apk
          if-no-files-found: error
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk

      - name: APK'yı yayınla (Release + apk-build dalı)
        if: github.ref_name == 'claude/3d-survival-game-xjhmmw'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          out=/tmp/apkout
          mkdir -p "$out"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$out/son-karargah-debug.apk"
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk "$out/son-karargah-release.apk"
          fi
          ( cd "$out" && sha256sum *.apk > SHA256SUMS.txt && ls -la )

          # 1) Telefondan doğrudan indirilebilsin diye sabit etiketli sürüm
          gh release delete apk-latest -y --cleanup-tag || true
          notes="Otomatik derleme (commit ${GITHUB_SHA:0:7}). son-karargah-debug.apk dosyasini telefona indirip kur; kurulum icin bilinmeyen kaynaklara izin vermen gerekir."
          gh release create apk-latest "$out"/*.apk "$out/SHA256SUMS.txt" \
            --target "$GITHUB_SHA" \
            --title "Son Karargah - son derleme" \
            --notes "$notes"

          # 2) Kaynak dalı temiz kalsın diye APK ayrı bir dalda tutulur
          work=/tmp/apkrepo
          rm -rf "$work"
          mkdir -p "$work"
          cp "$out"/*.apk "$out/SHA256SUMS.txt" "$work/"
          cd "$work"
          git init -q -b apk-build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "APK derlemesi ${GITHUB_SHA:0:7}"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" apk-build

      - name: Özet
        run: |
          echo "### Son Karargâh APK hazır" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Artifacts bölümünden \`son-karargah-apk\` dosyasını indirip telefona kurabilirsin." >> $GITHUB_STEP_SUMMARY
          ls -la android/app/build/outputs/apk/*/ >> $GITHUB_STEP_SUMMARY || true
