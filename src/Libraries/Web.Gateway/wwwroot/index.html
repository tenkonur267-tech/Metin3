<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#14110f">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Metin3</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<main id="app">
    <section id="screen-login" class="screen is-active">
        <div class="panel">
            <h1 class="brand">Metin3</h1>
            <p class="brand-sub">web client</p>
            <label for="username">Account</label>
            <input id="username" type="text" autocomplete="username" autocapitalize="none"
                   spellcheck="false" value="admin">
            <label for="password">Password</label>
            <input id="password" type="password" autocomplete="current-password" value="admin">
            <button id="btn-login" type="button" class="primary">Enter</button>
            <p id="login-status" class="status" role="status"></p>
        </div>
    </section>

    <section id="screen-select" class="screen">
        <div class="panel">
            <h2>Characters</h2>
            <ul id="character-list" class="characters"></ul>
            <details id="create-box">
                <summary>Create a character</summary>
                <label for="new-name">Name</label>
                <input id="new-name" type="text" autocapitalize="none" spellcheck="false" maxlength="24">
                <label for="new-class">Class</label>
                <select id="new-class">
                    <option value="0">Warrior (m)</option>
                    <option value="1">Ninja (f)</option>
                    <option value="2">Sura (m)</option>
                    <option value="3">Shaman (f)</option>
                    <option value="4">Warrior (f)</option>
                    <option value="5">Ninja (m)</option>
                    <option value="6">Sura (f)</option>
                    <option value="7">Shaman (m)</option>
                </select>
                <button id="btn-create" type="button" class="primary">Create</button>
            </details>
            <p id="select-status" class="status" role="status"></p>
        </div>
    </section>

    <section id="screen-game" class="screen">
        <canvas id="viewport"></canvas>

        <div id="hud-top">
            <div class="nameplate">
                <span id="hud-name">-</span>
                <span id="hud-level" class="badge">Lv -</span>
            </div>
            <div class="bars">
                <div class="bar"><i id="bar-hp" style="width:100%"></i></div>
            </div>
            <div id="hud-coords" class="coords">-</div>
        </div>

        <div id="chat-log" aria-live="polite"></div>

        <div id="chat-bar">
            <input id="chat-input" type="text" placeholder="Say something, or /help"
                   autocomplete="off" autocapitalize="sentences">
            <button id="btn-send" type="button">Send</button>
        </div>

        <div id="joystick" aria-hidden="true">
            <div id="joystick-knob"></div>
        </div>

        <div id="connection-lost" class="overlay" hidden>
            <div class="panel">
                <h2>Disconnected</h2>
                <p class="status">The connection to the server was lost.</p>
                <button id="btn-reload" type="button" class="primary">Reconnect</button>
            </div>
        </div>
    </section>
</main>
<script src="app.js"></script>
</body>
</html>
